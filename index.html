        <!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khám phá Hàm số Lượng giác</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tùy chỉnh màu sắc thanh trượt và checkboxes */
        input[type=range] { accent-color: #6366f1; }
        .checkbox-sin { accent-color: #ef4444; }
        .checkbox-cos { accent-color: #3b82f6; }
        .checkbox-tan { accent-color: #22c55e; }
        .checkbox-cot { accent-color: #a855f7; }
        canvas { touch-action: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-screen flex flex-col">

    <header class="bg-slate-800 text-white p-4 shadow-md flex justify-between items-center z-10 relative border-b border-slate-700">
        <h1 class="text-xl md:text-2xl font-bold">Khám Phá Hàm Số Lượng Giác</h1>
        <div class="text-sm md:text-base bg-slate-900 px-3 py-1 rounded-full border border-slate-600 shadow-inner text-indigo-300">
            Góc hiện tại: <span id="angleDisplay" class="font-mono font-bold w-20 inline-block text-right">-2.00π</span>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden gap-4 p-4 relative">
        
        <!-- Overlay Canvas dùng để vẽ đường nối nét đứt giữa 2 bảng -->
        <canvas id="overlayCanvas" class="absolute top-0 left-0 w-full h-full pointer-events-none z-50"></canvas>

        <!-- Cột trái: Vòng tròn lượng giác -->
        <div class="flex-1 bg-slate-800 rounded-xl shadow-lg border border-slate-700 flex flex-col relative min-h-[300px]">
            <div class="p-3 border-b border-slate-700 font-semibold text-slate-300 bg-slate-800/50 rounded-t-xl z-10">
                Vòng Tròn Lượng Giác
            </div>
            <div class="flex-1 relative w-full h-full" id="circleContainer">
                <canvas id="circleCanvas" class="absolute top-0 left-0 w-full h-full"></canvas>
            </div>
        </div>

        <!-- Cột phải: Đồ thị hàm số -->
        <div class="flex-1 lg:flex-[2] bg-slate-800 rounded-xl shadow-lg border border-slate-700 flex flex-col relative min-h-[300px]">
            <div class="p-3 border-b border-slate-700 font-semibold text-slate-300 bg-slate-800/50 rounded-t-xl flex justify-between items-center z-10">
                <span>Đồ Thị Hàm Số Oxy</span>
                <span class="text-xs font-normal text-slate-400">Tỉ lệ chuẩn toán học (1:1)</span>
            </div>
            <div class="flex-1 relative w-full h-full" id="graphContainer">
                <canvas id="graphCanvas" class="absolute top-0 left-0 w-full h-full"></canvas>
            </div>
        </div>
    </main>

    <footer class="bg-slate-800 border-t border-slate-700 p-4 md:p-6 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10 relative">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row gap-6 items-center">
            
            <div class="flex flex-wrap justify-center gap-4 md:gap-6 bg-slate-900 p-3 rounded-lg w-full md:w-auto border border-slate-700">
                <label class="flex items-center gap-2 cursor-pointer font-semibold text-red-500 hover:opacity-80 transition">
                    <input type="checkbox" id="chkSin" class="checkbox-sin w-5 h-5 cursor-pointer"> y = sin(x)
                </label>
                <label class="flex items-center gap-2 cursor-pointer font-semibold text-blue-500 hover:opacity-80 transition">
                    <input type="checkbox" id="chkCos" class="checkbox-cos w-5 h-5 cursor-pointer"> y = cos(x)
                </label>
                <label class="flex items-center gap-2 cursor-pointer font-semibold text-green-500 hover:opacity-80 transition">
                    <input type="checkbox" id="chkTan" class="checkbox-tan w-5 h-5 cursor-pointer"> y = tan(x)
                </label>
                <label class="flex items-center gap-2 cursor-pointer font-semibold text-purple-500 hover:opacity-80 transition">
                    <input type="checkbox" id="chkCot" class="checkbox-cot w-5 h-5 cursor-pointer"> y = cot(x)
                </label>
            </div>

            <div class="flex-1 w-full flex flex-col gap-2">
                <div class="flex justify-between items-center text-sm font-semibold text-slate-400 mb-1">
                    <span>-2π</span>
                    <div class="flex gap-2">
                        <!-- Nút Bắt đầu lại -->
                        <button id="btnResetAngle" class="flex items-center gap-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-md transition-colors shadow-sm cursor-pointer z-10">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
                            <span class="hidden sm:inline">Bắt đầu lại</span>
                        </button>
                        <!-- Nút Tự động chạy -->
                        <button id="btnAutoPlay" class="flex items-center gap-1.5 bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 px-3 py-1.5 rounded-md transition-colors shadow-sm cursor-pointer z-10 border border-indigo-500/30">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                            <span>Tự động chạy</span>
                        </button>
                    </div>
                    <span>2π</span>
                </div>
                <!-- Slider chạy từ -2*PI đến 2*PI -->
                <input type="range" id="angleSlider" min="-6.28319" max="6.28319" step="0.01" value="-6.28319" 
                       class="w-full h-3 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                <div class="flex justify-between text-xs text-slate-400 mt-1">
                    <span>-1 vòng</span>
                    <span>-1/2 vòng</span>
                    <span>0</span>
                    <span>1/2 vòng</span>
                    <span>1 vòng</span>
                </div>
            </div>

        </div>
    </footer>

    <script>
        const COLORS = {
            sin: '#ef4444', cos: '#3b82f6', tan: '#22c55e', cot: '#a855f7',
            axis: '#64748b', grid: '#334155', circle: '#94a3b8', angle: '#f59e0b',
            text: '#cbd5e1' // Thêm màu chữ sáng dành cho chế độ tối
        };

        let currentAngle = -6.28319;
        let show = { sin: false, cos: false, tan: false, cot: false };
        let sharedScale = 50; // Biến lưu tỷ lệ dùng chung cho vòng tròn và đồ thị

        // Lấy các DOM Elements
        const circleCanvas = document.getElementById('circleCanvas');
        const graphCanvas = document.getElementById('graphCanvas');
        const overlayCanvas = document.getElementById('overlayCanvas');
        const ctxCircle = circleCanvas.getContext('2d');
        const ctxGraph = graphCanvas.getContext('2d');
        const ctxOverlay = overlayCanvas.getContext('2d');
        const slider = document.getElementById('angleSlider');
        const angleDisplay = document.getElementById('angleDisplay');
        const mainElement = document.querySelector('main');

        // Bộ nhớ lưu tọa độ để vẽ đường kết nối Overlay
        let globalPoints = { circle: {}, graph: {} };

        let isAutoPlaying = false;
        let autoPlayAnimationId;
        const autoPlaySpeed = 0.02; // Tốc độ tự động chạy (đã giảm 1/2)
        const btnAutoPlay = document.getElementById('btnAutoPlay');
        const btnResetAngle = document.getElementById('btnResetAngle');
        
        const iconPlay = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`;
        const iconPause = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>`;

        function autoPlayLoop() {
            if (!isAutoPlaying) return;

            currentAngle += autoPlaySpeed;
            
            // Nếu chạy hết thanh trượt, quay lại từ đầu (-2 PI)
            if (currentAngle > parseFloat(slider.max)) {
                currentAngle = parseFloat(slider.min);
            }

            slider.value = currentAngle;
            updateDisplay();
            draw();

            autoPlayAnimationId = requestAnimationFrame(autoPlayLoop);
        }

        function toggleAutoPlay() {
            isAutoPlaying = !isAutoPlaying;
            if (isAutoPlaying) {
                btnAutoPlay.innerHTML = iconPause + ' <span>Dừng</span>';
                btnAutoPlay.classList.remove('bg-indigo-500/20', 'text-indigo-300', 'hover:bg-indigo-500/30', 'border-indigo-500/30');
                btnAutoPlay.classList.add('bg-red-500/20', 'text-red-300', 'hover:bg-red-500/30', 'border-red-500/30');
                autoPlayLoop();
            } else {
                btnAutoPlay.innerHTML = iconPlay + ' <span>Tự động chạy</span>';
                btnAutoPlay.classList.remove('bg-red-500/20', 'text-red-300', 'hover:bg-red-500/30', 'border-red-500/30');
                btnAutoPlay.classList.add('bg-indigo-500/20', 'text-indigo-300', 'hover:bg-indigo-500/30', 'border-indigo-500/30');
                cancelAnimationFrame(autoPlayAnimationId);
            }
        }

        btnAutoPlay.addEventListener('click', toggleAutoPlay);

        btnResetAngle.addEventListener('click', () => {
            if (isAutoPlaying) toggleAutoPlay(); // Dừng nếu đang chạy tự động
            currentAngle = parseFloat(slider.min); // Trở về vị trí bắt đầu
            slider.value = currentAngle;
            updateDisplay();
            draw();
        });

        // Dừng tự động nếu người dùng chủ động tương tác thanh trượt
        slider.addEventListener('mousedown', () => { if (isAutoPlaying) toggleAutoPlay(); });
        slider.addEventListener('touchstart', () => { if (isAutoPlaying) toggleAutoPlay(); }, {passive: true});

        slider.addEventListener('input', (e) => {
            currentAngle = parseFloat(e.target.value);
            updateDisplay();
            draw();
        });

        ['chkSin', 'chkCos', 'chkTan', 'chkCot'].forEach(id => {
            document.getElementById(id).addEventListener('change', (e) => {
                const func = id.replace('chk', '').toLowerCase();
                show[func] = e.target.checked;
                draw();
            });
        });

        function resizeCanvas() {
            const circleRect = document.getElementById('circleContainer').getBoundingClientRect();
            circleCanvas.width = circleRect.width;
            circleCanvas.height = circleRect.height;

            const graphRect = document.getElementById('graphContainer').getBoundingClientRect();
            graphCanvas.width = graphRect.width;
            graphCanvas.height = graphRect.height;

            const mainRect = mainElement.getBoundingClientRect();
            overlayCanvas.width = mainRect.width;
            overlayCanvas.height = mainRect.height;

            draw();
        }

        window.addEventListener('resize', resizeCanvas);

        function updateDisplay() {
            let piValue = currentAngle / Math.PI;
            angleDisplay.textContent = (piValue > 0 ? "+" : "") + piValue.toFixed(2) + "π";
        }

        function drawCircle() {
            const w = circleCanvas.width;
            const h = circleCanvas.height;
            if (w <= 0 || h <= 0) return;

            const cx = w / 2;
            const cy = h / 2;
            // 💡 R sử dụng tỷ lệ chung đã được tính toán ở hàm draw()
            const R = sharedScale; 

            ctxCircle.clearRect(0, 0, w, h);
            globalPoints.circle = {}; // Reset điểm

            // Hệ tọa độ chính (có mũi tên)
            ctxCircle.beginPath();
            ctxCircle.strokeStyle = COLORS.axis;
            ctxCircle.lineWidth = 2;
            
            // Trục Ngang (Ox)
            ctxCircle.moveTo(20, cy); ctxCircle.lineTo(w - 15, cy);
            ctxCircle.lineTo(w - 23, cy - 4); // Cánh trên
            ctxCircle.moveTo(w - 15, cy);
            ctxCircle.lineTo(w - 23, cy + 4); // Cánh dưới

            // Trục Dọc (Oy)
            ctxCircle.moveTo(cx, h - 20); ctxCircle.lineTo(cx, 15);
            ctxCircle.lineTo(cx - 4, 23); // Cánh trái
            ctxCircle.moveTo(cx, 15);
            ctxCircle.lineTo(cx + 4, 23); // Cánh phải
            ctxCircle.stroke();
            
            ctxCircle.fillStyle = COLORS.text;
            ctxCircle.font = '12px Inter';
            ctxCircle.fillText('x', w - 10, cy + 15);
            ctxCircle.fillText('y', cx + 12, 12);
            ctxCircle.fillText('cos', w - 40, cy - 10);
            ctxCircle.fillText('sin', cx - 25, 25);

            // Ghi chú nhãn giá trị 0, 1, -1 trên hệ trục Vòng tròn
            ctxCircle.fillStyle = COLORS.text; 
            ctxCircle.font = '11px Inter';
            ctxCircle.fillText('O', cx - 12, cy + 15);
            ctxCircle.fillText('1', cx + R + 5, cy + 15); // x = 1
            ctxCircle.fillText('-1', cx - R - 18, cy + 15); // x = -1
            ctxCircle.fillText('1', cx - 15, cy - R - 8); // y = 1 (trên)
            ctxCircle.fillText('-1', cx - 20, cy + R + 15); // y = -1 (dưới)

            // Vòng tròn đơn vị
            ctxCircle.beginPath();
            ctxCircle.arc(cx, cy, R, 0, 2 * Math.PI);
            ctxCircle.strokeStyle = COLORS.circle;
            ctxCircle.lineWidth = 2;
            ctxCircle.stroke();

            // Trục Tan (tiếp tuyến dọc)
            if (show.tan) {
                ctxCircle.beginPath();
                ctxCircle.strokeStyle = COLORS.tan + '66';
                ctxCircle.lineWidth = 1;
                ctxCircle.moveTo(cx + R, 20);
                ctxCircle.lineTo(cx + R, h - 20);
                ctxCircle.stroke();
                ctxCircle.fillStyle = COLORS.tan;
                ctxCircle.fillText('trục tan', cx + R + 5, 30);
            }

            // Trục Cot (tiếp tuyến ngang)
            if (show.cot) {
                ctxCircle.beginPath();
                ctxCircle.strokeStyle = COLORS.cot + '66';
                ctxCircle.lineWidth = 1;
                ctxCircle.moveTo(20, cy - R);
                ctxCircle.lineTo(w - 20, cy - R);
                ctxCircle.stroke();
                ctxCircle.fillStyle = COLORS.cot;
                ctxCircle.fillText('trục cot', w - 50, cy - R - 10);
            }

            const mx = cx + R * Math.cos(currentAngle);
            const my = cy - R * Math.sin(currentAngle);

            ctxCircle.beginPath();
            ctxCircle.moveTo(cx, cy);
            ctxCircle.arc(cx, cy, R * 0.2, 0, -currentAngle, currentAngle > 0);
            ctxCircle.fillStyle = COLORS.angle + '40';
            ctxCircle.fill();
            ctxCircle.strokeStyle = COLORS.angle;
            ctxCircle.stroke();

            ctxCircle.beginPath();
            ctxCircle.moveTo(cx, cy);
            ctxCircle.lineTo(mx, my);
            ctxCircle.strokeStyle = '#e2e8f0';
            ctxCircle.lineWidth = 2;
            ctxCircle.stroke();

            ctxCircle.beginPath();
            ctxCircle.arc(mx, my, 5, 0, 2 * Math.PI);
            ctxCircle.fillStyle = '#e2e8f0';
            ctxCircle.fill();

            // 1. Ghi nhận SIN
            if (show.sin) {
                globalPoints.circle.sin = { x: cx, y: my };
                ctxCircle.beginPath();
                ctxCircle.setLineDash([5, 5]);
                ctxCircle.moveTo(mx, my);
                ctxCircle.lineTo(cx, my);
                ctxCircle.strokeStyle = COLORS.sin;
                ctxCircle.lineWidth = 1;
                ctxCircle.stroke();
                
                ctxCircle.setLineDash([]);
                ctxCircle.beginPath();
                ctxCircle.moveTo(cx, cy);
                ctxCircle.lineTo(cx, my);
                ctxCircle.lineWidth = 4;
                ctxCircle.stroke();
            }

            // 2. Ghi nhận COS
            if (show.cos) {
                globalPoints.circle.cos = { x: mx, y: cy };
                ctxCircle.beginPath();
                ctxCircle.setLineDash([5, 5]);
                ctxCircle.moveTo(mx, my);
                ctxCircle.lineTo(mx, cy);
                ctxCircle.strokeStyle = COLORS.cos;
                ctxCircle.lineWidth = 1;
                ctxCircle.stroke();
                
                ctxCircle.setLineDash([]);
                ctxCircle.beginPath();
                ctxCircle.moveTo(cx, cy);
                ctxCircle.lineTo(mx, cy);
                ctxCircle.lineWidth = 4;
                ctxCircle.stroke();
            }

            // 3. Ghi nhận TAN
            if (show.tan) {
                let tanVal = Math.tan(currentAngle);
                if (Math.abs(tanVal) < 10) {
                    let ty = cy - R * tanVal;
                    globalPoints.circle.tan = { x: cx + R, y: ty };
                    
                    ctxCircle.beginPath();
                    ctxCircle.setLineDash([5, 5]);
                    ctxCircle.moveTo(cx, cy);
                    ctxCircle.lineTo(cx + R, ty);
                    ctxCircle.strokeStyle = COLORS.tan;
                    ctxCircle.lineWidth = 1;
                    ctxCircle.stroke();

                    ctxCircle.setLineDash([]);
                    ctxCircle.beginPath();
                    ctxCircle.moveTo(cx + R, cy);
                    ctxCircle.lineTo(cx + R, ty);
                    ctxCircle.lineWidth = 4;
                    ctxCircle.stroke();

                    ctxCircle.beginPath();
                    ctxCircle.arc(cx + R, ty, 4, 0, 2*Math.PI);
                    ctxCircle.fillStyle = COLORS.tan;
                    ctxCircle.fill();
                }
            }

            // 4. Ghi nhận COT
            if (show.cot) {
                let cotVal = 1 / Math.tan(currentAngle);
                if (Math.abs(cotVal) < 10) {
                    let tx = cx + R * cotVal;
                    globalPoints.circle.cot = { x: tx, y: cy - R };
                    
                    ctxCircle.beginPath();
                    ctxCircle.setLineDash([5, 5]);
                    ctxCircle.moveTo(cx, cy);
                    ctxCircle.lineTo(tx, cy - R);
                    ctxCircle.strokeStyle = COLORS.cot;
                    ctxCircle.lineWidth = 1;
                    ctxCircle.stroke();

                    ctxCircle.setLineDash([]);
                    ctxCircle.beginPath();
                    ctxCircle.moveTo(cx, cy - R);
                    ctxCircle.lineTo(tx, cy - R);
                    ctxCircle.lineWidth = 4;
                    ctxCircle.stroke();

                    ctxCircle.beginPath();
                    ctxCircle.arc(tx, cy - R, 4, 0, 2*Math.PI);
                    ctxCircle.fillStyle = COLORS.cot;
                    ctxCircle.fill();
                }
            }
            ctxCircle.setLineDash([]); 
        }

        function drawGraph() {
            const w = graphCanvas.width;
            const h = graphCanvas.height;
            if (w <= 0 || h <= 0) return;

            const cx = w / 2;
            const cy = h / 2;
            
            ctxGraph.clearRect(0, 0, w, h);
            globalPoints.graph = {}; // Reset điểm

            // 💡 Tỉ lệ chuẩn: 1 đơn vị trục X bằng đúng 1 đơn vị trục Y
            const xScale = sharedScale; 
            const yScale = sharedScale; 

            // Lưới đồ thị
            ctxGraph.beginPath();
            ctxGraph.strokeStyle = COLORS.grid;
            ctxGraph.lineWidth = 1;
            
            // Vẽ lưới theo giới hạn màn hình động
            const maxY = Math.ceil((h / 2) / yScale);
            for(let y = -maxY; y <= maxY; y++) {
                let py = cy - y * yScale;
                ctxGraph.moveTo(0, py); ctxGraph.lineTo(w, py);
            }
            
            // Tính toán số vạch lưới PI/2 tối đa có thể hiển thị trên nửa màn hình hiện tại
            const maxK = Math.ceil((w / 2) / (Math.PI / 2 * xScale));
            for(let i = -maxK; i <= maxK; i++) {
                let ang = i * Math.PI / 2;
                let px = cx + ang * xScale;
                ctxGraph.moveTo(px, 0); ctxGraph.lineTo(px, h);
            }
            ctxGraph.stroke(); // Vẽ xong đường lưới

            // Vẽ trục chính Oxy (có mũi tên)
            ctxGraph.beginPath();
            ctxGraph.strokeStyle = COLORS.axis;
            ctxGraph.lineWidth = 2;
            
            // Trục Ox
            ctxGraph.moveTo(0, cy); ctxGraph.lineTo(w - 5, cy);
            ctxGraph.lineTo(w - 13, cy - 4);
            ctxGraph.moveTo(w - 5, cy);
            ctxGraph.lineTo(w - 13, cy + 4);
            
            // Trục Oy
            ctxGraph.moveTo(cx, h); ctxGraph.lineTo(cx, 5);
            ctxGraph.lineTo(cx - 4, 13);
            ctxGraph.moveTo(cx, 5);
            ctxGraph.lineTo(cx + 4, 13);
            ctxGraph.stroke();
            
            // Ghi chú nhãn các trục x, y
            ctxGraph.font = '11px Inter';
            ctxGraph.fillStyle = COLORS.text;
            ctxGraph.textAlign = 'center';
            ctxGraph.fillText('x', w - 10, cy + 15);
            ctxGraph.fillText('y', cx + 12, 12);
            
            // Vẽ các nhãn trên trục hoành (xử lý dạng phân số \dfrac)
            for(let i = -maxK; i <= maxK; i++) {
                if (i !== 0) {
                    let px = cx + i * Math.PI / 2 * xScale;
                    let label = "";
                    
                    // Khởi tạo label với cấu trúc \dfrac{}{}
                    if(i === 2) label = "π";
                    else if(i === -2) label = "-π";
                    else if(i % 2 === 0) label = (i/2) + "π";
                    else if(i === 1) label = "\\dfrac{π}{2}";
                    else if(i === -1) label = "-\\dfrac{π}{2}";
                    else {
                        let sign = i < 0 ? "-" : "";
                        label = sign + "\\dfrac{" + Math.abs(i) + "π}{2}";
                    }
                    
                    // Parser hiển thị \dfrac{}{} thành phân số thực trên đồ thị
                    if (label.includes("\\dfrac")) {
                        let match = label.match(/(-?)\\dfrac\{([^}]+)\}\{([^}]+)\}/);
                        if (match) {
                            let sign = match[1];
                            let num = match[2];
                            let den = match[3];
                            
                            let signWidth = sign ? ctxGraph.measureText(sign).width : 0;
                            let numWidth = ctxGraph.measureText(num).width;
                            let denWidth = ctxGraph.measureText(den).width;
                            let fracWidth = Math.max(numWidth, denWidth);
                            
                            let totalWidth = signWidth + fracWidth + (sign ? 2 : 0);
                            let startX = px - totalWidth / 2;
                            
                            // Vẽ dấu trừ (-) nếu có
                            if (sign) {
                                ctxGraph.fillText(sign, startX + signWidth/2, cy + 18);
                            }
                            
                            let fracCenterX = startX + signWidth + (sign ? 2 : 0) + fracWidth/2;
                            
                            // Vẽ Tử số và Mẫu số
                            ctxGraph.fillText(num, fracCenterX, cy + 12);
                            ctxGraph.fillText(den, fracCenterX, cy + 26);
                            
                            // Kẻ vạch ngang phân số
                            ctxGraph.beginPath();
                            ctxGraph.strokeStyle = COLORS.axis;
                            ctxGraph.lineWidth = 1;
                            ctxGraph.moveTo(fracCenterX - fracWidth/2 - 2, cy + 16);
                            ctxGraph.lineTo(fracCenterX + fracWidth/2 + 2, cy + 16);
                            ctxGraph.stroke();
                        }
                    } else {
                        ctxGraph.fillText(label, px, cy + 15);
                    }
                }
            }

            function plotFunction(func, color, checkAsymptote, name) {
                ctxGraph.beginPath();
                ctxGraph.strokeStyle = color;
                ctxGraph.lineWidth = 2;
                
                let isFirstPoint = true;
                let prevYVal = 0;

                const step = 0.05;
                const startX = -2 * Math.PI;
                
                for (let x = startX; x <= currentAngle; x += step) {
                    let calcX = (x + step > currentAngle) ? currentAngle : x; 
                    
                    let yVal = func(calcX);
                    let px = cx + calcX * xScale;
                    let py = cy - yVal * yScale;

                    let jump = false;
                    if (checkAsymptote && !isFirstPoint) {
                        if (Math.abs(yVal - prevYVal) > 5) jump = true;
                    }

                    if (isFirstPoint || jump) {
                        ctxGraph.moveTo(px, py);
                        isFirstPoint = false;
                    } else {
                        ctxGraph.lineTo(px, py);
                    }
                    prevYVal = yVal;
                }
                ctxGraph.stroke();

                if (currentAngle >= startX) {
                    let finalY = func(currentAngle);
                    // Kiểm tra điểm cuối có nằm trong vùng nhìn thấy của Canvas không
                    if (Math.abs(finalY * yScale) <= h / 2 - 5) { 
                        let px = cx + currentAngle * xScale;
                        let py = cy - finalY * yScale;
                        
                        globalPoints.graph[name] = { x: px, y: py };

                        // ĐẶC BIỆT DÀNH CHO COS VÀ COT: Vẽ đoạn tung độ đậm để so sánh độ dài
                        if (name === 'cos' || name === 'cot') {
                            ctxGraph.beginPath();
                            ctxGraph.setLineDash([5, 5]); // Chuyển thành nét đứt
                            ctxGraph.moveTo(px, cy); // Từ trục hoành Ox
                            ctxGraph.lineTo(px, py); // Lên/xuống điểm đồ thị
                            ctxGraph.strokeStyle = color;
                            ctxGraph.lineWidth = 2; // Chỉnh mảnh hơn (giảm từ 4 xuống 2)
                            ctxGraph.stroke();
                            ctxGraph.setLineDash([]); // Trả lại nét liền cho các hình vẽ sau
                        }

                        ctxGraph.beginPath();
                        ctxGraph.arc(px, py, 4, 0, 2*Math.PI);
                        ctxGraph.fillStyle = '#1e293b'; // Trùng với màu nền bảng tối
                        ctxGraph.fill();
                        ctxGraph.lineWidth = 2;
                        ctxGraph.strokeStyle = color;
                        ctxGraph.stroke();
                    }
                }
            }

            if (show.sin) plotFunction(Math.sin, COLORS.sin, false, 'sin');
            if (show.cos) plotFunction(Math.cos, COLORS.cos, false, 'cos');
            if (show.tan) plotFunction(Math.tan, COLORS.tan, true, 'tan');
            if (show.cot) plotFunction((a) => 1 / Math.tan(a), COLORS.cot, true, 'cot');
        }

        function drawConnections() {
            ctxOverlay.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            
            const mainRect = mainElement.getBoundingClientRect();
            const circleRect = document.getElementById('circleContainer').getBoundingClientRect();
            const graphRect = document.getElementById('graphContainer').getBoundingClientRect();

            Object.keys(show).forEach(func => {
                // CHỈ vẽ đường nối Overlay cho SIN và TAN
                if ((func === 'sin' || func === 'tan') && show[func] && globalPoints.circle[func] && globalPoints.graph[func]) {
                    const p1 = globalPoints.circle[func];
                    const p2 = globalPoints.graph[func];

                    const startX = p1.x + (circleRect.left - mainRect.left);
                    const startY = p1.y + (circleRect.top - mainRect.top);
                    
                    const endX = p2.x + (graphRect.left - mainRect.left);
                    const endY = p2.y + (graphRect.top - mainRect.top);

                    ctxOverlay.beginPath();
                    ctxOverlay.setLineDash([8, 6]);
                    ctxOverlay.moveTo(startX, startY);
                    ctxOverlay.lineTo(endX, endY);
                    
                    ctxOverlay.strokeStyle = COLORS[func];
                    ctxOverlay.globalAlpha = 0.4;
                    ctxOverlay.lineWidth = 1.5;
                    ctxOverlay.stroke();
                    
                    ctxOverlay.globalAlpha = 1.0;
                    ctxOverlay.setLineDash([]);
                }
            });
        }

        function draw() {
            // Tính toán tỷ lệ đồng bộ (1 đơn vị R = 1 đơn vị Y)
            const hGraph = graphCanvas.height;
            const minDimCircle = Math.min(circleCanvas.width, circleCanvas.height);
            
            // Đồ thị y muốn hiển thị lý tưởng trong khoảng biên độ từ -2.5 đến 2.5
            let scaleY = (hGraph / 2) / 2.5; 
            // Bán kính R tối đa mà vòng tròn chứa được (chừa lề 40px để hiển thị nhãn)
            let maxR = (minDimCircle / 2) - 40;
            
            // Lấy giá trị nhỏ hơn làm tỷ lệ chung để đảm bảo 2 bên đều hiển thị gọn gàng
            sharedScale = Math.max(10, Math.min(scaleY, maxR));

            drawCircle();
            drawGraph();
            drawConnections(); // Vẽ cầu nối cuối cùng
        }

        setTimeout(() => {
            resizeCanvas();
            updateDisplay();
        }, 100);

    </script>
